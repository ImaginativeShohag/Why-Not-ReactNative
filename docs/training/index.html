<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>React Native Training — Why-Not-ReactNative</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 17l5 5 9-12' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Resolve the theme before first paint so there is no flash. -->
<script>
  try {
    var s = (JSON.parse(localStorage.getItem("wnrn-training-v1")) || {}).settings || {};
    var t = s.theme && s.theme !== "system" ? s.theme : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  } catch (e) {
    document.documentElement.dataset.theme = "dark";
  }
</script>
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="qz-backdrop" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="qz-scrollbar" aria-hidden="true"><span id="scroll-progress"></span></div>

<!-- Shared gradient for progress rings. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="qz-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
</svg>

<header class="qz-topbar" id="topbar"></header>
<main class="qz-wrap" id="app">
  <noscript>The training quiz needs JavaScript.</noscript>
</main>
<footer class="qz-footer">
  <div class="qz-wrap">
    <span>Why-Not-ReactNative · React Native Training</span>
    <span>Progress is stored only in this browser. <a href="../learning-path.html">Back to the learning path</a></span>
  </div>
</footer>
<div id="saved" class="qz-saved" aria-live="polite"></div>
<div id="toast" class="qz-toast" role="status"></div>

<script src="quiz.js"></script>
<!-- One script per bank. Adding a bank? Add its tag here; validate.mjs checks they match. -->
<script src="banks/00-launcher.js"></script>
<script src="banks/01-offline-journal.js"></script>
<script src="banks/02-camera-social.js"></script>
<script src="banks/03-store.js"></script>
<script src="banks/04-fitness-tracker.js"></script>
<script src="banks/05-podcast-player.js"></script>
<script src="banks/06-tic-tac-toe.js"></script>
<script>QUIZ.start();</script>
</body>
</html>
