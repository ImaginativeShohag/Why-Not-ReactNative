plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.liveactivity'
version = '1.0.0'

android {
  namespace "expo.modules.liveactivity"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat / NotificationManagerCompat. Gradle resolves this up to
  // whatever newer androidx.core react-android already pulls in.
  implementation "androidx.core:core-ktx:1.13.1"
}
